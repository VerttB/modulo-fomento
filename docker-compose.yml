services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fomento
      POSTGRES_USER: fomento
      POSTGRES_PASSWORD: fomento
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fomento -d fomento"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    command: ["/app/.venv/bin/uvicorn", "src.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload", "--reload-dir", "/app/src"]
    environment:
      DATABASE_URL: postgresql+psycopg://fomento:fomento@db:5432/fomento
    ports:
      - "8000:8000"
    volumes:
      - ./src:/app/src
      - ./migrations:/app/migrations
      - ./alembic.ini:/app/alembic.ini:ro
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
