services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Configure POSTGRES_DB no arquivo .env}
      POSTGRES_USER: ${POSTGRES_USER:?Configure POSTGRES_USER no arquivo .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configure POSTGRES_PASSWORD no arquivo .env}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./app/backend
    image: modulo-fomento-api:local
    command: ["/app/.venv/bin/uvicorn", "src.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload", "--reload-dir", "/app/src"]
    environment: &backend_env
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      TERRITORIOS_CSV_PATH: ${TERRITORIOS_CSV_PATH:-/app/data/referencias/dim_territorio_identidade.csv}
      POPULACAO_MUNICIPIOS_CSV_PATH: ${POPULACAO_MUNICIPIOS_CSV_PATH:-/app/data/referencias/IBGE_Cidades_Bahia.csv}
      INGESTOES_PATH: ${INGESTOES_PATH:-/app/storage/ingestoes}
      SIMCC_IDENTIFICADOR_URL: ${SIMCC_IDENTIFICADOR_URL:-https://simcc.uesc.br/v3/api/getIdentificadorCNPq}
      SIMCC_RESEARCHERS_URL: ${SIMCC_RESEARCHERS_URL:-https://observatoriocti.secti.ba.gov.br/simcc/api/researchers}
      VIA_CEP_URL: ${VIA_CEP_URL:-https://viacep.com.br/ws/{cep}/json/}
      MARIA_API_URL: ${MARIA_API_URL:?Configure MARIA_API_URL no arquivo .env}
      MARIA_API_TIMEOUT_SECONDS: ${MARIA_API_TIMEOUT_SECONDS:?Configure MARIA_API_TIMEOUT_SECONDS no arquivo .env}
      EXTERNAL_API_TIMEOUT_SECONDS: ${EXTERNAL_API_TIMEOUT_SECONDS:-20}
      INGEST_BATCH_SIZE: ${INGEST_BATCH_SIZE:-100}
      INGEST_CHECKPOINT_INTERVAL: ${INGEST_CHECKPOINT_INTERVAL:-10}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?Configure CORS_ALLOWED_ORIGINS no arquivo .env}
    ports:
      - "${API_PORT:-10010}:8000"
    volumes:
      - ./app/backend/src:/app/src
      - ./app/backend/data:/app/data:ro
      - ./app/backend/migrations:/app/migrations
      - ./app/backend/alembic.ini:/app/alembic.ini:ro
      - ingest_data:/app/storage/ingestoes
    depends_on:
      db:
        condition: service_healthy

  hop-image:
    image: apache/hop:2.18.0
    entrypoint: ["/bin/sh", "-c"]
    command: ["exit 0"]

  hop-dispatcher:
    build: ./app/backend
    image: modulo-fomento-dispatcher:local
    restart: unless-stopped
    command: ["/app/.venv/bin/python", "-m", "src.commands.hop_dispatcher"]
    environment:
      <<: *backend_env
      HOP_INGEST_API_URL: ${HOP_INGEST_API_URL:?Configure HOP_INGEST_API_URL no arquivo .env}
      HOP_JOB_IMAGE: apache/hop:2.18.0
      HOP_DOCKER_SOCKET: /var/run/docker.sock
      HOP_PROJECT_PATH: /project
      HOP_RETRY_DELAY_SECONDS: 30
    volumes:
      - ./app/hop:/project:ro
      - ./app/backend/src:/app/src:ro
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      api:
        condition: service_started
      hop-image:
        condition: service_completed_successfully

  hop:
    image: apache/hop:2.18.0
    profiles: ["hop"]
    environment:
      HOP_PROJECT_FOLDER: /project
      HOP_PROJECT_NAME: modulo_fomento
      HOP_FILE_PATH: /project/workflows/retomar_ingestao.hwf
      HOP_RUN_CONFIG: local
      HOP_INGEST_API_URL: ${HOP_INGEST_API_URL:-}
      HOP_INGESTAO_ID: ${HOP_INGESTAO_ID:-}
    volumes:
      - ./app/hop:/project:ro
    depends_on:
      - api

  web:
    build: ./app/frontend
    command: ["sh", "-c", "npm ci && npm run dev -- --host 0.0.0.0"]
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:?Configure VITE_API_BASE_URL no arquivo .env}
      VITE_SIMCC_API_URL: ${VITE_SIMCC_API_URL:-}
    ports:
      - "5173:5173"
    volumes:
      - ./app/frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - api

volumes:
  postgres_data:
  frontend_node_modules:
  ingest_data:
